<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APUS</title>
<meta name="description" content="Today has a sound. It starts with one line.">
<meta name="theme-color" content="#101B3D">
<meta property="og:title" content="APUS">
<meta property="og:description" content="Today has a sound. It starts with one line.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='23' fill='%230B0B0C'/%3E%3Cpath d='M22 58 A28 28 0 0 1 78 58 Z' fill='%23FF5A1F'/%3E%3Cellipse cx='56' cy='66' rx='34' ry='5' fill='%23FFB15C' opacity='0.55'/%3E%3Crect x='12' y='57.5' width='76' height='1.5' fill='%23F1E9DC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="fonts/apus-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap">
<style>
/* APUS Display: modified from Anybody (SIL OFL 1.1), see fonts/OFL.txt */
@font-face { font-family: "APUS Display"; src: url(fonts/apus-display.woff2) format("woff2"); font-weight: 800; font-display: swap; }
:root {
  --ink: #0B0B0C;
  --dusk: #101B3D;
  --ember: #FF5A1F;
  --glow: #FFB15C;
  --cream: #F1E9DC;
  --muted: #A8A29A;
  --line: #2A2A2E;
  --sun: clamp(180px, 46vw, 320px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--cream); }
body {
  font-family: 'Libre Baskerville', Georgia, serif; font-style: italic;
  -webkit-font-smoothing: antialiased;
  min-height: 100svh;
  overflow-x: hidden;
}
main { min-height: 100svh; display: flex; flex-direction: column; position: relative; }

/* Sky: still */
.sky {
  background: var(--dusk);
  position: relative; overflow: hidden;
  min-height: calc(100svh - 130px);
  padding: max(28px, env(safe-area-inset-top)) 22px 0;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
.wordmark { width: 132px; height: auto; display: block; position: relative; z-index: 2; animation: soft 1.4s ease .1s both; }
.copy { position: relative; z-index: 2; align-self: stretch; text-align: left; margin: 30px 0 0; will-change: transform, opacity; }
h1 {
  font-family: 'APUS Display', sans-serif;
  font-weight: 800; font-style: normal;
  font-size: clamp(64px, 19.5vw, 168px);
  letter-spacing: -0.035em; line-height: 0.86;
  margin: 0;
}
.lede {
  font-size: clamp(15px, 3.9vw, 17.5px); line-height: 1.6;
  color: #D9D1C3; margin: 22px 0 0; max-width: 300px;
  text-wrap: pretty;
}
.solar { position: relative; width: var(--sun); height: calc(var(--sun) / 2); margin-top: auto; padding-top: 0; flex: none; }
@media (max-width: 899px) { .sky { min-height: 0; } .solar { margin-top: 64px; } }
.solar svg { position: absolute; left: 50%; bottom: 0; width: calc(var(--sun) * 3); height: calc(var(--sun) * 1.5); transform: translateX(-50%); overflow: visible; }
.disc { fill: var(--ember); transform-box: view-box; }
.ring { fill: var(--ember); fill-opacity: 0; transform-box: view-box; }
.ray { stroke: var(--ember); stroke-width: 1.6; stroke-linecap: butt; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.sun-g { animation: rise 2s cubic-bezier(.16,.84,.24,1) .15s both; }
@keyframes rise { from { transform: translateY(104px); } }

.horizon { height: 2px; background: var(--cream); width: 100%; }

/* Water: moving */
.water {
  position: relative; flex: 1 0 auto;
  overflow: hidden;
  padding: 64px 16px max(40px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
}
.waves, .reflection, .shade { position: absolute; pointer-events: none; }
.waves { left: -40px; top: 0; width: calc(100% + 80px); height: 100%; background: #0B0B0C url(waves.jpg) center top / cover no-repeat; animation: drift 11s ease-in-out infinite alternate; will-change: transform; }
.reflection { left: 50%; top: 0; width: var(--sun); height: 100%; transform: translateX(-50%); }
.reflection img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.reflection .r2 { animation: shimmer 2.8s ease-in-out infinite alternate; }
.shade { inset: 0; background: linear-gradient(to bottom, rgba(11,11,12,0) 0, rgba(11,11,12,.5) 90px, rgba(11,11,12,.86) 260px, rgba(11,11,12,.95) 100%); }
@keyframes drift { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
@keyframes shimmer { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .waves, .reflection .r2 { animation: none; } }

/* The card */
.card {
  position: relative; width: 100%; max-width: 520px;
  padding: 8px 6px 0;
  text-align: center;
}
.q {
  font-family: 'APUS Display', sans-serif; font-weight: 800; font-style: normal;
  font-size: clamp(34px, 10vw, 46px); letter-spacing: -0.03em; line-height: .92; margin: 0; display: block;
  text-align: center; text-wrap: balance;
}
.sub { margin: 18px auto 0; max-width: 300px; font-family: 'APUS Display', sans-serif; font-weight: 800; font-style: normal; font-size: 15px; line-height: 1.25; letter-spacing: -0.005em; color: var(--muted); text-wrap: balance; }
.field { margin-top: 48px; }
textarea {
  display: block; width: 100%; background: transparent; color: var(--cream);
  border: 0; border-radius: 0; outline: none; -webkit-appearance: none; appearance: none;
  font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: 21px; line-height: 1.4; text-align: center;
  resize: none; overflow: hidden; padding: 0 0 4px; caret-color: var(--cream);
}
textarea::placeholder { color: #8A847B; }
.mirror {
  margin-top: 6px; min-height: 29px; text-align: center; white-space: pre-wrap; overflow-wrap: break-word;
  font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: 21px; line-height: 1.4; color: var(--cream);
  opacity: .26; transform: scale(1.06, -1); filter: blur(2.5px); pointer-events: none; user-select: none;
}
.mirror.ph { color: #6E6A64; opacity: .32; }
.count { display: block; min-height: 18px; margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.full { color: var(--cream); }
.form > .act { display: block; margin: 8px auto 0; }
.act {
  background: none; border: 0; padding: 8px 0; margin: 0; cursor: pointer;
  font-family: 'APUS Display', sans-serif; font-weight: 800; font-style: normal;
  font-size: 18px; letter-spacing: .04em; text-transform: uppercase; color: var(--cream);
  transition: color .3s;
}
.act:disabled { color: #3F3C39; cursor: default; }
.act:not(:disabled):hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.act:focus-visible { outline: 1px solid var(--cream); outline-offset: 4px; }
.act sup { font-size: 1em; margin-left: -2px; position: relative; top: -.32em; vertical-align: baseline; line-height: 0; color: var(--muted); }
.note { margin: 26px auto 0; max-width: 300px; text-align: center; font-size: 12.5px; line-height: 1.6; color: #7D776F; }
.err { margin: 14px 0 0; font-size: 15px; color: var(--cream); min-height: 0; }
.ok { display: flex; gap: 12px; align-items: flex-start; margin-top: 20px; font-size: 14px; line-height: 1.4; color: var(--muted); cursor: pointer; }
.ok input { -webkit-appearance: none; appearance: none; flex: none; width: 18px; height: 18px; margin: 1px 0 0; border: 1px solid var(--muted); border-radius: 0; background: transparent; display: grid; place-items: center; cursor: pointer; }
.ok input:checked { background: var(--cream); border-color: var(--cream); }
.ok input:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateY(-1px) rotate(-45deg); }
.ok input:focus-visible { outline: 1px solid var(--cream); outline-offset: 3px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

/* Intro */
h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .02em .1em; margin-bottom: -.1em; }
h1 .w > span { display: inline-block; animation: up 1.15s cubic-bezier(.16,.84,.24,1) both; animation-delay: calc(.45s + var(--i) * .09s); }
@keyframes up { from { transform: translateY(108%); } }
@keyframes soft { from { opacity: 0; transform: translateY(8px); } }
.lede { animation: soft 1.3s ease 1.05s both; }
.horizon { transform-origin: 50% 50%; animation: draw 1.6s cubic-bezier(.65,0,.35,1) .05s both; }
@keyframes draw { from { transform: scaleX(0); } }
.water > .waves { animation: fadein 2s ease .4s both, drift 11s ease-in-out 2.4s infinite alternate; }
@keyframes fadein { from { opacity: 0; } }
.card { opacity: 0; transform: translateY(36px); transition: opacity 1.1s ease, transform 1.2s cubic-bezier(.16,.84,.24,1); transition-delay: .9s; }
.card.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  h1 .w > span, .lede, .wordmark, .horizon, .sun-g, .water > .waves { animation: none; }
  .card { opacity: 1; transform: none; transition: none; }
}

/* After sending: its own page */
.after { position: fixed; inset: 0; z-index: 4; background: var(--ink); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: max(56px, env(safe-area-inset-top)) 22px max(36px, env(safe-area-inset-bottom)); overflow-y: auto; opacity: 0; transition: opacity .9s ease; }
.after[hidden] { display: none; }
.after.in { opacity: 1; }
.after-in { margin: auto 0; text-align: center; }
.after h2 { margin: 0; font-family: 'APUS Display', sans-serif; font-weight: 800; font-style: normal; font-size: clamp(56px, 16vw, 140px); letter-spacing: -0.035em; line-height: .86; color: var(--cream); }
.after p { margin: 20px 0 0; font-size: 17px; line-height: 1.55; color: #D9D1C3; max-width: 300px; margin-left: auto; margin-right: auto; }
.mark { width: 72px; height: auto; display: block; flex: none; margin-top: 48px; }
body.sent { overflow: hidden; }
@media (min-width: 900px) { .after { padding-left: 6vw; padding-right: 6vw; } }
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: url(grain.webp) repeat; background-size: 256px 256px; opacity: .14; }

@media (min-width: 900px) {
  .sky { padding-left: 6vw; padding-right: 6vw; }
  .copy { margin-top: 40px; }
  .water { padding-top: 64px; }
}
</style>
</head>
<body>
<main>
  <section class="sky">
    <img class="wordmark" src="wordmark.webp" alt="APUS" width="132" height="38">
    <div class="copy">
      <h1 aria-label="Today has a sound."><span class="w" aria-hidden="true"><span style="--i:0">Today</span></span> <span class="w" aria-hidden="true"><span style="--i:1">has</span></span> <span class="w" aria-hidden="true"><span style="--i:2">a</span></span> <span class="w" aria-hidden="true"><span style="--i:3">sound.</span></span></h1>
      <p class="lede">It starts with one line. Yours.</p>
    </div>
<div class="solar" aria-hidden="true">
      <svg viewBox="-300 -150 600 150" preserveAspectRatio="xMidYMax meet">
        <g class="sun-g">
          <g class="aura"><circle class="ring" r="270" data-o="0.05"/><circle class="ring" r="214" data-o="0.08"/><circle class="ring" r="168" data-o="0.12"/><circle class="ring" r="132" data-o="0.18"/></g>
          <g class="rays"><line class="ray" x1="-112.0" y1="-30.0" x2="-214.4" y2="-57.5" pathLength="1"/><line class="ray" x1="-100.5" y1="-58.0" x2="-154.2" y2="-89.0" pathLength="1"/><line class="ray" x1="-82.0" y1="-82.0" x2="-157.0" y2="-157.0" pathLength="1"/><line class="ray" x1="-58.0" y1="-100.5" x2="-89.0" y2="-154.2" pathLength="1"/><line class="ray" x1="-30.0" y1="-112.0" x2="-57.5" y2="-214.4" pathLength="1"/><line class="ray" x1="-0.0" y1="-116.0" x2="-0.0" y2="-178.0" pathLength="1"/><line class="ray" x1="30.0" y1="-112.0" x2="57.5" y2="-214.4" pathLength="1"/><line class="ray" x1="58.0" y1="-100.5" x2="89.0" y2="-154.2" pathLength="1"/><line class="ray" x1="82.0" y1="-82.0" x2="157.0" y2="-157.0" pathLength="1"/><line class="ray" x1="100.5" y1="-58.0" x2="154.2" y2="-89.0" pathLength="1"/><line class="ray" x1="112.0" y1="-30.0" x2="214.4" y2="-57.5" pathLength="1"/></g>
          <path class="disc" d="M-100 0 A100 100 0 0 1 100 0 Z"/>
        </g>
      </svg>
    </div>
  </section>
  <div class="horizon" aria-hidden="true"></div>
  <section class="water">
    <div class="waves" aria-hidden="true"></div>
    <div class="reflection" aria-hidden="true"><img src="reflection-11.webp" alt=""><img class="r2" src="reflection-23.webp" alt=""></div>
    <div class="shade" aria-hidden="true"></div>

    <div class="card">
      <form class="form" id="f" novalidate>
        <label class="q" for="line">What's in your head right now?</label>
        <p class="sub" id="sub">What you'd tell a friend if they picked up. Or what you'd keep to yourself.</p>
        <div class="field">
          <textarea aria-describedby="sub" id="line" name="line" maxlength="160" rows="1" placeholder="Write it here." autocomplete="off" required></textarea>
        </div>
        <div class="mirror" id="mirror" aria-hidden="true"></div>
        <input class="hp" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <span class="count" id="count" aria-live="polite"></span>
        <button class="act" type="submit" id="send" disabled>Send<sup>*</sup></button>
        <p class="err" id="err" role="alert"></p>
        <p class="note">* Anonymous, stored in the EU, never sold or shared. Sending means you're ok with that.</p>
      </form>
    </div>
  </section>
</main>
<section class="after" id="after" aria-live="polite" hidden>
  <div class="after-in">
    <h2>Thank you.</h2>
    <p>You were here before the sun went down.</p>
  </div>
  <svg class="mark" role="img" aria-label="APUS" viewBox="10 28 80 44"><path d="M22 58 A28 28 0 0 1 78 58 Z" fill="#FF5A1F"/><ellipse cx="56" cy="66" rx="34" ry="5" fill="#FFB15C" opacity="0.55"/><rect x="12" y="57.5" width="76" height="1.5" fill="#F1E9DC"/></svg>
</section>
<div class="grain" aria-hidden="true"></div>

<script>
/* ===== Fill these in from Supabase: Project Settings > API ===== */
const APUS_CONFIG = {
  supabaseUrl: "https://wyqpxtfsgqfpnlufkvcg.supabase.co",
  supabaseKey: "sb_publishable_4ZXzZizUU6g-vHd_vrpcwg_VLGoqjss", // publishable key, safe to be public (insert-only)
  table: "vibes",
  textColumn: "feeling",
  handleColumn: null,
  extra: { consent: true } // sending = consent, explained in the * note under SEND
};
const DAILY_LIMIT = 5;
/* ================================================================ */

const $ = (id) => document.getElementById(id);
const line = $('line'), send = $('send'), err = $('err');

function update() {
  const n = line.value.length;
  $('count').textContent = n >= 120 ? n + '/160' : '';
  $('count').classList.toggle('full', n >= 160);
  line.parentNode.classList.toggle('filled', n > 0);
  const m = $('mirror');
  m.textContent = n ? line.value : line.placeholder;
  m.classList.toggle('ph', !n);
  send.disabled = line.value.trim().length < 3;
  line.style.height = 'auto';
  line.style.height = line.scrollHeight + 'px';
  m.style.height = (line.scrollHeight - 4) + 'px';
}
line.addEventListener('input', update);

function todayKey() { return 'apus-sent-' + new Date().toISOString().slice(0, 10); }
function sentToday() { try { return parseInt(localStorage.getItem(todayKey()) || '0', 10); } catch (e) { return 0; } }
function markSent() { try { localStorage.setItem(todayKey(), String(sentToday() + 1)); } catch (e) {} }

async function insert(row) {
  const key = APUS_CONFIG.supabaseKey;
  const headers = { 'apikey': key, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  if (key.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + key;
  return fetch(APUS_CONFIG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/' + encodeURIComponent(APUS_CONFIG.table), {
    method: 'POST', headers, body: JSON.stringify(row)
  });
}

async function save(text, at) {
  if (!APUS_CONFIG.supabaseUrl || !APUS_CONFIG.supabaseKey) {
    console.warn('APUS: Supabase not configured, running in preview mode.');
    await new Promise(r => setTimeout(r, 500));
    return true;
  }
  const row = Object.assign({ [APUS_CONFIG.textColumn]: text }, APUS_CONFIG.extra || {});
  if (APUS_CONFIG.handleColumn && at) row[APUS_CONFIG.handleColumn] = at;
  let res = await insert(row);
  if (!res.ok && APUS_CONFIG.handleColumn && at) {
    // If the handle column doesn't exist, keep the line and drop the @.
    const body = await res.text();
    if (/PGRST204|column/i.test(body)) {
      res = await insert(Object.assign({ [APUS_CONFIG.textColumn]: text }, APUS_CONFIG.extra || {}));
    }
  }
  if (!res.ok) { console.error('APUS insert failed', res.status, await res.text()); }
  return res.ok;
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  const text = line.value.trim().slice(0, 160);
  if (text.length < 3) return;
  if ($('website').value) { finish(text, ''); return; }
  if (sentToday() >= DAILY_LIMIT) { err.textContent = "That's enough for today. Come back tomorrow."; return; }
  const at = '';
  send.disabled = true; send.textContent = 'Sending';
  let ok = false;
  try { ok = await save(text, at); } catch (x) { console.error(x); }
  send.innerHTML = 'Send<sup>*</sup>';
  if (!ok) { err.textContent = "That didn't go through. Try again."; send.disabled = false; return; }
  markSent();
  finish(text, at);
});

function finish(text, at) {
  const a = $('after');
  a.hidden = false;
  document.body.classList.add('sent');
  requestAnimationFrame(() => requestAnimationFrame(() => a.classList.add('in')));
}

update();

/* Scroll: the sun opens up */
(function () {
  const sky = document.querySelector('.sky');
  const copy = document.querySelector('.copy');
  const wm = document.querySelector('.wordmark');
  const rays = [...document.querySelectorAll('.ray')];
  const rings = [...document.querySelectorAll('.ring')];
  const disc = document.querySelector('.disc');
  const refl = document.querySelector('.reflection');
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (v) => 1 - Math.pow(1 - v, 3);
  let ticking = false;
  function frame() {
    ticking = false;
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    const span = Math.max(120, Math.min(max, sky.offsetHeight * 0.55));
    const p = clamp(window.scrollY / span);
    rays.forEach((r, i) => {
      const q = ease(clamp((p - i * 0.025) / 0.62));
      r.style.strokeDashoffset = String(1 - q);
      r.style.opacity = String(Math.min(1, q * 1.6));
    });
    rings.forEach((c, i) => {
      const q = ease(clamp((p - (rings.length - 1 - i) * 0.07) / 0.55));
      c.style.fillOpacity = String(parseFloat(c.dataset.o) * q);
      c.style.transform = 'scale(' + (0.86 + 0.14 * q) + ')';
    });
    disc.style.transform = 'scale(' + (1 + 0.035 * ease(p)) + ')';
    copy.style.transform = 'translateY(' + (-34 * ease(p)) + 'px)';
    copy.style.opacity = String(1 - 0.4 * ease(p));
    if (wm) wm.style.transform = copy.style.transform;
    if (refl) refl.style.opacity = String(0.75 + 0.25 * ease(p));
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  window.addEventListener('resize', update);
  frame();

  const card = document.querySelector('.card');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { card.classList.add('in'); io.disconnect(); setTimeout(() => { card.style.transitionDelay = '0s'; }, 2200); } });
    }, { threshold: 0.05 });
    io.observe(card);
  } else { card.classList.add('in'); }
})();
</script>
</body>
</html>
