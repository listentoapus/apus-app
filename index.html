<style>
:root {
  --ink: #0B0B0C;
  --dusk: #101B3D;
  --ember: #FF5A1F;
  --glow: #FFB15C;
  --cream: #F1E9DC;
  --muted: #A8A29A;
  --line: #2A2A2E;
  --sun: clamp(180px, 46vw, 320px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--cream); }
body {
  font-family: 'Hedvig Letters Serif', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100svh;
  overflow-x: hidden;
}
main { min-height: 100svh; display: flex; flex-direction: column; position: relative; }

/* Sky: still */
.sky {
  background: var(--dusk);
  position: relative; overflow: hidden;
  min-height: calc(100svh - 130px);
  padding: max(28px, env(safe-area-inset-top)) 22px 0;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
.wordmark { width: 132px; height: auto; display: block; position: relative; z-index: 2; animation: soft 1.4s ease .1s both; }
.copy { position: relative; z-index: 2; max-width: 560px; margin: 28px auto 26px; will-change: transform, opacity; }
h1 {
  font-family: 'Anybody', sans-serif;
  font-weight: 800; font-stretch: 100%;
  font-size: clamp(40px, 11.4vw, 84px);
  letter-spacing: -0.03em; line-height: 0.95;
  margin: 0;
  text-wrap: balance;
}
.lede {
  font-size: clamp(16px, 4.2vw, 19px); line-height: 1.45;
  color: #D9D1C3; margin: 18px auto 0; max-width: 440px;
  text-wrap: pretty;
}
.solar { position: relative; width: var(--sun); height: calc(var(--sun) / 2); margin-top: auto; flex: none; }
.solar svg { position: absolute; left: 50%; bottom: 0; width: calc(var(--sun) * 3); height: calc(var(--sun) * 1.5); transform: translateX(-50%); overflow: visible; }
.disc { fill: var(--ember); transform-box: view-box; }
.ring { fill: var(--ember); fill-opacity: 0; transform-box: view-box; }
.ray { stroke: var(--ember); stroke-width: 1.6; stroke-linecap: butt; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.sun-g { animation: rise 2s cubic-bezier(.16,.84,.24,1) .15s both; }
@keyframes rise { from { transform: translateY(104px); } }

.horizon { height: 2px; background: var(--cream); width: 100%; }

/* Water: moving */
.water {
  position: relative; flex: 1 0 auto;
  overflow: hidden;
  padding: 44px 16px max(40px, env(safe-area-inset-bottom));
  display: flex; justify-content: center; align-items: flex-start;
}
.waves, .reflection, .shade { position: absolute; pointer-events: none; }
.waves { left: -40px; top: 0; width: calc(100% + 80px); height: 100%; animation: drift 11s ease-in-out infinite alternate; }
.reflection { left: 50%; top: 0; width: var(--sun); height: 100%; transform: translateX(-50%); }
.reflection .hl { animation: shimmer 6s ease-in-out infinite alternate; }
.shade { inset: 0; background: linear-gradient(to bottom, rgba(11,11,12,0) 30%, rgba(11,11,12,.85) 100%); }
@keyframes drift { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
@keyframes shimmer { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
@media (prefers-reduced-motion: reduce) { .waves, .reflection .hl { animation: none; } }

/* The card */
.card {
  position: relative; width: 100%; max-width: 520px;
  background: rgba(11,11,12,.72);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  padding: 24px 22px 20px;
  text-align: left;
}
.q {
  font-family: 'Anybody', sans-serif; font-weight: 800; font-stretch: 100%;
  font-size: 24px; letter-spacing: -0.02em; line-height: 1.05; margin: 0;
}
.hint { margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); }
textarea, input[type="text"] {
  display: block; width: 100%;
  background: transparent; color: var(--cream);
  border: 0; border-radius: 0;
  font-family: 'Hedvig Letters Serif', Georgia, serif;
  outline: none; -webkit-appearance: none; appearance: none;
}
textarea {
  margin-top: 16px; font-size: 21px; line-height: 1.35; resize: none;
  min-height: 2.7em; padding: 0 0 6px;
}
textarea::placeholder, input::placeholder { color: #5E5A55; }
input[type="text"] { border-bottom: 1px solid var(--line); }
input[type="text"]:focus { border-bottom-color: var(--cream); }
.meter { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.bar { flex: 1; height: 1px; background: var(--line); position: relative; }
.bar i { position: absolute; left: 0; top: 0; height: 1px; width: 0; background: var(--cream); transition: width .15s; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
.count.full { color: var(--cream); }
.handle { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .45s ease, opacity .45s ease, margin .45s ease; margin-top: 0; }
.handle > div { overflow: hidden; }
.handle.on { grid-template-rows: 1fr; opacity: 1; margin-top: 22px; }
.handle label { display: block; font-size: 15px; color: var(--muted); line-height: 1.4; }
.handle input { margin-top: 6px; font-size: 18px; padding: 0 0 8px; }
.row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 22px; }
.fine { font-size: 13px; line-height: 1.4; color: var(--muted); max-width: 240px; }
.act {
  background: none; border: 0; padding: 6px 0; margin: 0; cursor: pointer;
  font-family: 'Anybody', sans-serif; font-weight: 800; font-stretch: 110%;
  font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--cream);
}
.act:disabled { color: #4E4A46; cursor: default; }
.act:not(:disabled):hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.act:focus-visible { outline: 1px solid var(--cream); outline-offset: 4px; }
.err { margin: 14px 0 0; font-size: 15px; color: var(--cream); min-height: 0; }
.ok { display: flex; gap: 12px; align-items: flex-start; margin-top: 20px; font-size: 14px; line-height: 1.4; color: var(--muted); cursor: pointer; }
.ok input { -webkit-appearance: none; appearance: none; flex: none; width: 18px; height: 18px; margin: 1px 0 0; border: 1px solid var(--muted); border-radius: 0; background: transparent; display: grid; place-items: center; cursor: pointer; }
.ok input:checked { background: var(--cream); border-color: var(--cream); }
.ok input:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateY(-1px) rotate(-45deg); }
.ok input:focus-visible { outline: 1px solid var(--cream); outline-offset: 3px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

.done { display: none; }
body.sent .form { display: none; }
body.sent .done { display: block; }
.done h2 {
  font-family: 'Anybody', sans-serif; font-weight: 800; font-stretch: 100%;
  font-size: 44px; letter-spacing: -0.03em; line-height: .95; margin: 0;
}
.done p { font-size: 18px; line-height: 1.45; color: #D9D1C3; margin: 14px 0 0; }
.done blockquote {
  margin: 20px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line);
  font-size: 19px; line-height: 1.4; color: var(--cream);
}
.done .row { justify-content: flex-end; }

/* Intro */
h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .02em .1em; margin-bottom: -.1em; }
h1 .w > span { display: inline-block; animation: up 1.15s cubic-bezier(.16,.84,.24,1) both; animation-delay: calc(.45s + var(--i) * .09s); }
@keyframes up { from { transform: translateY(108%); } }
@keyframes soft { from { opacity: 0; filter: blur(8px); transform: translateY(8px); } }
.lede { animation: soft 1.3s ease 1.05s both; }
.horizon { transform-origin: 50% 50%; animation: draw 1.6s cubic-bezier(.65,0,.35,1) .05s both; }
@keyframes draw { from { transform: scaleX(0); } }
.water > svg { animation: fadein 2s ease .4s both; }
@keyframes fadein { from { opacity: 0; } }
.card { opacity: 0; transform: translateY(36px); filter: blur(6px); transition: opacity 1.1s ease, transform 1.2s cubic-bezier(.16,.84,.24,1), filter 1.1s ease; transition-delay: .9s; }
.card.in { opacity: 1; transform: none; filter: none; }
@media (prefers-reduced-motion: reduce) {
  h1 .w > span, .lede, .wordmark, .horizon, .sun-g, .water > svg { animation: none; }
  .card { opacity: 1; transform: none; filter: none; transition: none; }
}

.grain { position: fixed; inset: 0; pointer-events: none; opacity: .16; mix-blend-mode: overlay; z-index: 5; }

@media (min-width: 900px) {
  .copy { margin-top: 36px; }
  .water { padding-top: 64px; }
}
</style>

          <g class="rays"><line class="ray" x1="-112.0" y1="-30.0" x2="-214.4" y2="-57.5" pathLength="1"/><line class="ray" x1="-100.5" y1="-58.0" x2="-154.2" y2="-89.0" pathLength="1"/><line class="ray" x1="-82.0" y1="-82.0" x2="-157.0" y2="-157.0" pathLength="1"/><line class="ray" x1="-58.0" y1="-100.5" x2="-89.0" y2="-154.2" pathLength="1"/><line class="ray" x1="-30.0" y1="-112.0" x2="-57.5" y2="-214.4" pathLength="1"/><line class="ray" x1="-0.0" y1="-116.0" x2="-0.0" y2="-178.0" pathLength="1"/><line class="ray" x1="30.0" y1="-112.0" x2="57.5" y2="-214.4" pathLength="1"/><line class="ray" x1="58.0" y1="-100.5" x2="89.0" y2="-154.2" pathLength="1"/><line class="ray" x1="82.0" y1="-82.0" x2="157.0" y2="-157.0" pathLength="1"/><line class="ray" x1="100.5" y1="-58.0" x2="154.2" y2="-89.0" pathLength="1"/><line class="ray" x1="112.0" y1="-30.0" x2="214.4" y2="-57.5" pathLength="1"/></g>
          <path class="disc" d="M-100 0 A100 100 0 0 1 100 0 Z"/>
        </g>
      </svg>
    </div>
  </section>
  <div class="horizon" aria-hidden="true"></div>
  <section class="water">
    <svg class="waves" aria-hidden="true" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMin slice">
      <defs>
        <filter id="wW" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.005 0.06" numOctaves="4" seed="11" result="n"/><feDiffuseLighting in="n" surfaceScale="5" lighting-color="#ffffff" result="l"><feDistantLight azimuth="270" elevation="26"/></feDiffuseLighting><feComponentTransfer in="l"><feFuncR type="gamma" amplitude="0.95" exponent="2.2" offset="0"/><feFuncG type="gamma" amplitude="0.95" exponent="2.2" offset="0"/><feFuncB type="gamma" amplitude="0.95" exponent="2.2" offset="0"/></feComponentTransfer></filter>
      </defs>
      <rect width="1440" height="800" filter="url(#wW)"/>
      <rect width="1440" height="800" fill="#04050A" opacity="0.5"/>
    </svg>
    <svg class="reflection" aria-hidden="true" viewBox="0 0 400 600" preserveAspectRatio="none">
      <defs>
        <filter id="wH" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.01 0.06" numOctaves="4" seed="11" result="n"/><feDiffuseLighting in="n" surfaceScale="5" lighting-color="#ffffff" result="l"><feDistantLight azimuth="270" elevation="26"/></feDiffuseLighting><feComponentTransfer in="l"><feFuncR type="linear" slope="4" intercept="-2.4"/><feFuncG type="linear" slope="4" intercept="-2.4"/><feFuncB type="linear" slope="4" intercept="-2.4"/></feComponentTransfer></filter>
        <mask id="wM" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="600"><rect class="hl" x="-80" y="0" width="560" height="600" fill="#ffffff" filter="url(#wH)"/></mask>
        <linearGradient id="wR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB15C"/><stop offset="0.45" stop-color="#FF5A1F"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0.1"/></linearGradient>
      </defs>
      <path d="M2 0 L398 0 L330 600 L70 600 Z" fill="url(#wR)" mask="url(#wM)"/>
    </svg>
    <div class="shade" aria-hidden="true"></div>

    <div class="card">
      <form class="form" id="f" novalidate>
        <label class="q" for="line">What's in your head right now?</label>
        <p class="hint">Say it like you'd text the one person who gets it. Where you are, what you can't let go of.</p>
        <textarea id="line" name="line" maxlength="160" rows="2" placeholder="On the night bus, still replaying what she said at dinner." autocomplete="off" required></textarea>
        <div class="meter" aria-hidden="true"><div class="bar"><i id="bar"></i></div><span class="count" id="count">0 / 160</span></div>
        <div class="handle" id="handleWrap"><div>
          <label for="handle">Leave your @ if you want to hear back. Optional.</label>
          <input type="text" id="handle" name="handle" maxlength="60" placeholder="@" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div></div>
        <label class="ok"><input type="checkbox" id="consent"><span>Keep my line. It's stored without my name and never shown with it.</span></label>
        <input class="hp" type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="row">
          <div class="fine"></div>
          <button class="act" type="submit" id="send" disabled>Send</button>
        </div>
        <p class="err" id="err" role="alert"></p>
      </form>
      <div class="done" aria-live="polite">
        <h2 id="doneTitle">Heard.</h2>
        <p id="doneText">Come back tomorrow. It will sound different.</p>
        <blockquote id="echo"></blockquote>
        <div class="row"><button class="act" type="button" id="again">Write another</button></div>
      </div>
    </div>
  </section>
</main>
<svg class="grain" aria-hidden="true" width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>

<script>
/* ===== Fill these in from Supabase: Project Settings > API ===== */
const APUS_CONFIG = {
  supabaseUrl: "https://wyqpxtfsgqfpnlufkvcg.supabase.co",
  supabaseKey: "sb_publishable_4ZXzZizUU6g-vHd_vrpcwg_VLGoqjss", // publishable key, safe to be public (insert-only)
  table: "vibes",
  textColumn: "feeling",
  handleColumn: "contact",
  extra: { consent: true } // only sent once the person ticks the box
};
const DAILY_LIMIT = 5;
/* ================================================================ */

const $ = (id) => document.getElementById(id);
const line = $('line'), handle = $('handle'), send = $('send'), err = $('err');

function update() {
  const n = line.value.length;
  $('count').textContent = n + ' / 160';
  $('count').classList.toggle('full', n >= 160);
  $('bar').style.width = (n / 160 * 100) + '%';
  send.disabled = line.value.trim().length < 3 || !$('consent').checked;
  if (line.value.trim().length >= 3) $('handleWrap').classList.add('on');
  line.style.height = 'auto';
  line.style.height = line.scrollHeight + 'px';
}
line.addEventListener('input', update);
$('consent').addEventListener('change', update);

function todayKey() { return 'apus-sent-' + new Date().toISOString().slice(0, 10); }
function sentToday() { try { return parseInt(localStorage.getItem(todayKey()) || '0', 10); } catch (e) { return 0; } }
function markSent() { try { localStorage.setItem(todayKey(), String(sentToday() + 1)); } catch (e) {} }

async function insert(row) {
  const key = APUS_CONFIG.supabaseKey;
  const headers = { 'apikey': key, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  if (key.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + key;
  return fetch(APUS_CONFIG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/' + encodeURIComponent(APUS_CONFIG.table), {
    method: 'POST', headers, body: JSON.stringify(row)
  });
}

async function save(text, at) {
  if (!APUS_CONFIG.supabaseUrl || !APUS_CONFIG.supabaseKey) {
    console.warn('APUS: Supabase not configured, running in preview mode.');
    await new Promise(r => setTimeout(r, 500));
    return true;
  }
  const row = Object.assign({ [APUS_CONFIG.textColumn]: text }, APUS_CONFIG.extra || {});
  if (APUS_CONFIG.handleColumn && at) row[APUS_CONFIG.handleColumn] = at;
  let res = await insert(row);
  if (!res.ok && APUS_CONFIG.handleColumn && at) {
    // If the handle column doesn't exist, keep the line and drop the @.
    const body = await res.text();
    if (/PGRST204|column/i.test(body)) {
      res = await insert(Object.assign({ [APUS_CONFIG.textColumn]: text }, APUS_CONFIG.extra || {}));
    }
  }
  if (!res.ok) { console.error('APUS insert failed', res.status, await res.text()); }
  return res.ok;
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  const text = line.value.trim().slice(0, 160);
  if (text.length < 3 || !$('consent').checked) return;
  if ($('website').value) { finish(text, ''); return; }
  if (sentToday() >= DAILY_LIMIT) { err.textContent = "That's enough for today. Come back tomorrow."; return; }
  let at = handle.value.trim().replace(/\s+/g, '');
  if (at && !at.startsWith('@')) at = '@' + at;
  send.disabled = true; send.textContent = 'Sending';
  let ok = false;
  try { ok = await save(text, at); } catch (x) { console.error(x); }
  send.textContent = 'Send';
  if (!ok) { err.textContent = "That didn't go through. Try again."; send.disabled = false; return; }
  markSent();
  finish(text, at);
});

function finish(text, at) {
  $('echo').textContent = text;
  $('doneText').textContent = at
    ? "If your line gets picked, you'll hear back. Check your DMs."
    : "Come back tomorrow. It will sound different.";
  document.body.classList.add('sent');
}

$('again').addEventListener('click', () => {
  line.value = ''; $('consent').checked = false; update();
  document.body.classList.remove('sent');
  line.focus();
});
update();

/* Scroll: the sun opens up */
(function () {
  const sky = document.querySelector('.sky');
  const copy = document.querySelector('.copy');
  const rays = [...document.querySelectorAll('.ray')];
  const rings = [...document.querySelectorAll('.ring')];
  const disc = document.querySelector('.disc');
  const refl = document.querySelector('.reflection');
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (v) => 1 - Math.pow(1 - v, 3);
  let ticking = false;
  function frame() {
    ticking = false;
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    const span = Math.max(120, Math.min(max, sky.offsetHeight * 0.55));
    const p = clamp(window.scrollY / span);
    rays.forEach((r, i) => {
      const q = ease(clamp((p - i * 0.025) / 0.62));
      r.style.strokeDashoffset = String(1 - q);
      r.style.opacity = String(Math.min(1, q * 1.6));
    });
    rings.forEach((c, i) => {
      const q = ease(clamp((p - (rings.length - 1 - i) * 0.07) / 0.55));
      c.style.fillOpacity = String(parseFloat(c.dataset.o) * q);
      c.style.transform = 'scale(' + (0.86 + 0.14 * q) + ')';
    });
    disc.style.transform = 'scale(' + (1 + 0.035 * ease(p)) + ')';
    copy.style.transform = 'translateY(' + (-34 * ease(p)) + 'px)';
    copy.style.opacity = String(1 - 0.4 * ease(p));
    if (refl) refl.style.opacity = String(0.75 + 0.25 * ease(p));
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  frame();

  const card = document.querySelector('.card');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { card.classList.add('in'); io.disconnect(); setTimeout(() => { card.style.transitionDelay = '0s'; }, 2200); } });
    }, { threshold: 0.05 });
    io.observe(card);
  } else { card.classList.add('in'); }
})();
</script>
</body>
