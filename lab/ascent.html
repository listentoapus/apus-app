<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>APUS</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap">
<link rel="stylesheet" href="base.css">
<style>:root{--ox:53%;--oy:30%}
.bw{filter:grayscale(1) contrast(1.7) brightness(.9)}
.door{left:46.5%;top:19%;width:12.5%;height:17.5%;object-fit:cover;object-position:50% 25%;mix-blend-mode:multiply;filter:grayscale(1) contrast(1.6) brightness(1.25);-webkit-mask-image:radial-gradient(ellipse 70% 80% at 50% 70%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 70% 80% at 50% 70%,#000 55%,transparent 100%)}
#sun{left:49%;width:8%;height:2.67%;top:33.4%}</style>
</head>
<body>
<!-- Photos: Unsplash License (free to use). Stairs: Belinda Fewings. Pyramid: Olga Bykova. -->
<div class="stage" aria-hidden="true"><div class="zoom" id="zoom"><img class="full bw" src="https://images.unsplash.com/photo-1618240723488-a42df0ed0574?w=1400&q=72&fm=jpg&sat=-100&auto=format" alt="">
<img class="door" src="https://images.unsplash.com/photo-1708174419616-70a98779b040?w=700&q=72&fm=jpg&sat=-100&auto=format" alt="">
<div class="sun" id="sun"></div></div></div>
<div class="vig" aria-hidden="true"></div>
<img class="wm" src="../wordmark.webp" alt="APUS">
<div class="ui">
  <label class="q disp" for="line">What's in your head right now?</label>
  <p class="sub disp">The text you'd send at 2am. Or the one you never send.</p>
  <textarea id="line" maxlength="160" rows="1" placeholder="Write it here." autocomplete="off"></textarea>
  <button class="act disp" id="send" type="button" disabled>Send<sup>*</sup></button>
  <p class="note">* Anonymous, stored in the EU, never sold or shared. Sending means you're ok with that.</p>
</div>
<section class="after" id="after" hidden><h2 class="disp">Thank you.</h2><p>You were here before the sun went down.</p></section>
<div class="grain" aria-hidden="true"></div>
<script type="module">import { run } from './ui.js';
const z = document.getElementById('zoom');
run((p, t) => { const s = 1 + Math.min(p, 1) * 0.55 + Math.max(0, p - 1) * 3.2; z.style.transform = `scale(${s.toFixed(4)}) translateY(${(Math.sin(t * .4) * 0.15).toFixed(3)}%)`; });</script>
</body>
</html>
