<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>APUS</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap">
<style>
@font-face { font-family: "APUS Display"; src: url(../fonts/apus-display.woff2) format("woff2"); font-weight: 800; font-display: swap; }
:root { --ink:#0B0B0C; --ember:#FF5A1F; --cream:#F1E9DC; --muted:#A8A29A; --dim:#7A756E; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--cream); }
body { font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; -webkit-font-smoothing: antialiased; overflow: hidden; }
.disp { font-family: 'APUS Display', sans-serif; font-weight: 800; font-style: normal; letter-spacing: -0.03em; }

/* the photograph: a fixed 2:3 frame that always covers the screen */
.stage { position: fixed; left: 50%; top: 50%; width: max(100vw, 66.667vh); height: max(150vw, 100vh); transform: translate(-50%, -50%); overflow: hidden; }
.zoom { position: absolute; inset: 0; transform-origin: 50.5% 42.5%; transition: transform 2s cubic-bezier(.65,0,.35,1); will-change: transform; }
.zoom img { position: absolute; display: block; }
.full { inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.75) brightness(.88); }
.ghost { inset: 0; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; opacity: .55; filter: grayscale(1) contrast(1.6);
  -webkit-mask-image: linear-gradient(#000 0, #000 30%, transparent 48%); mask-image: linear-gradient(#000 0, #000 30%, transparent 48%); }
.win { position: absolute; left: 40.5%; top: 25%; width: 20%; height: 35%; overflow: hidden; clip-path: polygon(0 6%, 100% 0, 100% 100%, 0 100%); }
.win .up { position: absolute; left: 0; right: 0; top: 0; height: 55%; overflow: hidden; }
.win .sun { position: absolute; left: 20%; width: 60%; height: 22.5%; top: 77.5%; background: var(--ember); border-radius: 50% 50% 0 0 / 100% 100% 0 0; transition: transform 2.4s cubic-bezier(.5,0,.2,1); }
.win .hz { position: absolute; left: 0; right: 0; top: 55%; height: 2px; background: var(--cream); opacity: .85; }
.win .below { position: absolute; left: 0; right: 0; top: calc(55% + 2px); bottom: 0; background: linear-gradient(rgba(11,11,12,.35), rgba(11,11,12,.75)); overflow: hidden; }
.win .rsun { position: absolute; left: 20%; width: 60%; top: 1%; height: 11%; background: var(--ember); border-radius: 0 0 50% 50% / 0 0 100% 100%; opacity: .16; filter: blur(2.4px); transform-origin: 50% 0; transition: transform 2.4s cubic-bezier(.5,0,.2,1); animation: rip 2.6s ease-in-out infinite; }
@keyframes rip { 0%,100% { translate: 0 0; } 50% { translate: 3% 0; } }
.fog { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 50% 40%, rgba(11,11,12,0) 50%, rgba(11,11,12,.8) 100%); transition: background 1.2s; }
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 20; background: url(../grain.webp) repeat; background-size: 256px; opacity: .17; mix-blend-mode: screen; animation: grain .9s steps(6) infinite; }
@keyframes grain { 0%{background-position:0 0} 20%{background-position:-60px 40px} 40%{background-position:30px -70px} 60%{background-position:-90px -20px} 80%{background-position:50px 80px} 100%{background-position:0 0} }
.wm { position: fixed; left: 50%; top: max(22px, env(safe-area-inset-top)); width: 96px; transform: translateX(-50%); z-index: 5; transition: opacity .8s; }

/* the question: comes out of the fog letter by letter, with its reflection in the water */
.ask { position: fixed; left: 0; right: 0; bottom: max(64px, calc(env(safe-area-inset-bottom) + 48px)); z-index: 4; text-align: center; padding: 0 22px; cursor: pointer; }
.q { font-size: clamp(32px, 9vw, 48px); line-height: .92; margin: 0 auto; max-width: 420px; }
.q .c { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(6px); animation: emerge 1.6s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--d); }
@keyframes emerge { to { opacity: 1; filter: blur(0); transform: none; } }
.refl { margin: 6px auto 0; transform: scaleY(-1); opacity: .22; filter: blur(1.6px); -webkit-mask-image: linear-gradient(to top, #000, transparent 85%); mask-image: linear-gradient(to top, #000, transparent 85%); animation: ripple 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes ripple { 0%,100% { transform: scaleY(-1) skewX(0deg); } 50% { transform: scaleY(-1.04) skewX(3deg); } }
.hint { margin: 14px 0 0; font-size: 14px; color: var(--muted); opacity: 0; animation: emerge 1.4s ease forwards 2.6s; filter: blur(4px); }
.ask .c.sink { animation: sink 1.1s cubic-bezier(.6,0,.4,1) forwards; animation-delay: var(--s); }
@keyframes sink { from { opacity: 1; filter: blur(0); transform: none; } to { opacity: 0; filter: blur(8px); transform: translateY(46px); } }
body.writing .ask { pointer-events: none; }
body.writing .hint, body.writing .refl { transition: opacity .6s; opacity: 0 !important; animation: none; }

/* inside the sun: big half sun on the horizon, it sets as you write */
html, body, .stage, .ask { cursor: pointer; }
body.writing, body.writing .stage { cursor: auto; }
.inside { position: fixed; inset: 0; z-index: 6; opacity: 0; pointer-events: none; }
body.writing .inside { opacity: 1; pointer-events: auto; }
.sky { position: absolute; inset: 0; background: linear-gradient(to bottom, #0B0B0C 0%, #141416 30%, #232327 52%, #2E2E33 62%, #0B0B0C 62.2%, #0B0B0C 100%); opacity: 0; transition: opacity 1.3s ease .7s; }
body.writing .sky { opacity: 1; }
.fx { opacity: 0; transition: opacity 1s ease 1.2s; }
body.writing .fx { opacity: 1; }
.pane { opacity: 0; transition: opacity .9s ease 1.9s; }
body.writing .pane { opacity: 1; }
.flysun { position: fixed; z-index: 12; background: var(--ember); border-radius: 999px 999px 0 0; transform-origin: 50% 100%; transition: transform 1.25s cubic-bezier(.65,0,.35,1), opacity .35s ease; }
.inside .hz { position: absolute; left: 0; right: 0; top: 62%; height: 2px; background: var(--cream); z-index: 1; transform-origin: 50% 50%; }
.inside .hz.off { transition: transform .9s cubic-bezier(.7,0,.3,1), opacity .3s ease .85s; transform: scaleX(0); opacity: 0; }
.dusk { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 0; pointer-events: none; transition: opacity 1.2s ease; }
.glow { position: absolute; left: -10%; right: -10%; top: calc(62% - 40px); height: 82px; z-index: 1; pointer-events: none;
  background: radial-gradient(50% 50% at 50% 50%, rgba(255,177,92,.32) 0%, rgba(255,90,31,.12) 40%, rgba(255,90,31,0) 75%); transition: opacity 1.2s ease, transform 1.2s ease; }
.glow.flare { transition: opacity .45s ease, transform .45s ease; opacity: 1 !important; transform: scaleX(1.5) scaleY(1.4); }
.glow.gone { transition: opacity .8s ease, transform .8s ease; opacity: 0 !important; transform: scaleX(.2) scaleY(.3); }
.spark { position: absolute; left: 50%; top: 62%; width: 9px; height: 9px; margin: -4px 0 0 -4.5px; border-radius: 50%; background: var(--ember); z-index: 2; opacity: 0; box-shadow: 0 0 18px 4px rgba(255,90,31,.55); }
.spark.on { animation: spark 1.1s ease forwards; }
@keyframes spark { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.3); } 60% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(.2); } }
body.sent .pane { transition: opacity .6s ease .5s; opacity: 0; }
.inside .up { position: absolute; left: 0; right: 0; top: 0; height: 62%; overflow: hidden; z-index: 1; }
.bigsun { position: absolute; left: 50%; bottom: 0; width: min(80vw, 440px); aspect-ratio: 2 / 1; margin-left: calc(min(80vw, 440px) / -2); background: var(--ember); border-radius: 999px 999px 0 0; transition: transform 1.2s cubic-bezier(.4,0,.2,1); }
.inside .below { position: absolute; left: 0; right: 0; top: calc(62% + 2px); bottom: 0; overflow: hidden; z-index: 1; }
.bigrefl { position: absolute; left: 50%; top: 4px; width: min(80vw, 440px); margin-left: calc(min(80vw, 440px) / -2); height: 34px; background: var(--ember); border-radius: 0 0 999px 999px; opacity: .14; filter: blur(5px); transform-origin: 50% 0; transition: transform 1.2s cubic-bezier(.4,0,.2,1); animation: rip 2.6s ease-in-out infinite; }
.inside .grainy { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 62%, rgba(11,11,12,0) 40%, rgba(11,11,12,.6) 100%); pointer-events: none; }
.pane { position: absolute; left: 22px; right: 22px; top: max(84px, calc(env(safe-area-inset-top) + 64px)); text-align: center; z-index: 3; }
.pane .sub { margin: 0 auto; max-width: 300px; font-size: 15px; line-height: 1.2; letter-spacing: -0.005em; color: var(--muted); }
.field { position: relative; margin: 26px auto 0; max-width: 460px; min-height: 84px; }
.field textarea, .field .shown { position: absolute; left: 0; right: 0; top: 0; min-height: 84px; margin: 0; padding: 0; border: 0; background: transparent; font: italic 21px/1.45 'Libre Baskerville', Georgia, serif; text-align: center; white-space: pre-wrap; overflow-wrap: break-word; }
.field textarea { position: relative; display: block; width: 100%; color: transparent; caret-color: var(--ember); outline: none; resize: none; overflow: hidden; -webkit-appearance: none; appearance: none; font-size: max(16px, 21px); }
.field textarea::placeholder { color: rgba(241,233,220,.42); }
.field .shown { bottom: 0; pointer-events: none; color: var(--cream); z-index: 1; }
.shown .w { display: inline-block; }
.shown.fall .w { transition: transform 1s cubic-bezier(.55,0,.75,.4), opacity 1s, filter 1s; transform: translateY(240px); opacity: 0; filter: blur(5px); }
.pane .act { display: block; margin: 14px auto 0; }

.foot { position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 7; pointer-events: none !important; text-align: center; padding: 0 24px; opacity: 0; pointer-events: none; transition: opacity .8s ease 1.4s; }
body.writing .foot { opacity: 1; pointer-events: auto; }
.act { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--cream); font-size: 17px; text-transform: uppercase; letter-spacing: .04em; transition: opacity .4s; }
.act:disabled { opacity: 0; pointer-events: none; }
.act sup { font-size: 1em; margin-left: -2px; position: relative; top: -.32em; vertical-align: baseline; line-height: 0; color: var(--muted); }
.note { margin: 8px auto 0; max-width: 290px; font-size: 11.5px; line-height: 1.55; color: var(--dim); }
body.sent .foot, body.sent .wm { opacity: 0 !important; transition-delay: 0s; }

/* after: thank you surfaces as a reflection first, then turns upright */
.after { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(11,11,12,0); pointer-events: none; transition: background .8s ease; }
.after.in { background: rgba(11,11,12,.96); pointer-events: auto; }
.after h2 { margin: 0; font-size: clamp(56px, 16vw, 128px); line-height: .86; opacity: 0; transform: translateY(14px); filter: blur(6px); }
.after.in h2 { transition: opacity 1.1s ease .15s, transform 1.3s cubic-bezier(.2,.7,.2,1) .15s, filter 1.1s ease .15s; opacity: 1; transform: none; filter: blur(0); }
@keyframes surface { 0% { opacity: 0; transform: translateY(40%) scaleY(-1); filter: blur(8px); } 45% { opacity: .35; transform: translateY(40%) scaleY(-1); filter: blur(3px); } 100% { opacity: 1; transform: none; filter: blur(0); } }
.after p { margin: 20px 0 0; font-size: 16px; line-height: 1.55; color: #D9D1C3; max-width: 290px; opacity: 0; }
.after.in p { animation: emerge 1.1s ease forwards .7s; filter: blur(6px); }
.after .mark { position: absolute; left: 50%; bottom: max(44px, calc(env(safe-area-inset-bottom) + 28px)); width: 76px; transform: translateX(-50%); opacity: 0; }
.after.in .mark { opacity: 1; }
@keyframes fadeup { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<!-- Photos: Unsplash License (free to use). Mirror in the water: 8machine. Sculpture: Danil Zakhvatkin. -->
<div class="stage" aria-hidden="true"><div class="zoom" id="zoom">
  <img class="full" src="https://images.unsplash.com/photo-1643686881664-1fea30b34787?w=2000&q=74&fm=jpg&sat=-100" alt="">
  <img class="ghost" src="https://images.unsplash.com/photo-1768170631448-a8b28ae4424b?w=1200&q=70&fm=jpg&sat=-100" alt="">
  <div class="win" id="win"><div class="up"><div class="sun" id="sun"></div></div><div class="hz"></div><div class="below"><div class="rsun" id="rsun"></div></div></div>
</div></div>
<div class="fog" aria-hidden="true"></div>
<img class="wm" src="../wordmark.webp" alt="APUS">

<div class="ask" id="ask" role="button" tabindex="0" aria-label="What's in your head right now? Write it on the mirror.">
  <p class="q disp" id="q" aria-hidden="true">What's in your head right now?</p>
  <p class="q disp refl" id="qr" aria-hidden="true">What's in your head right now?</p>
  <p class="hint">Write it on the mirror.</p>
</div>

<div class="inside" id="inside">
  <div class="sky"></div>
  <div class="up"><div class="bigsun" id="bigsun"></div></div>
  <div class="hz" id="bighz"></div>
  <div class="fx"><div class="glow" id="glow"></div>
  <div class="below"><div class="bigrefl" id="bigrefl"></div></div>
  <div class="grainy"></div></div>
  <div class="dusk" id="dusk"></div>
  <div class="pane">
    <p class="sub disp">The text you'd send at 2am. Or the one you never send.</p>
    <div class="field">
      <div class="shown" id="shown" aria-hidden="true"></div>
      <textarea id="line" maxlength="160" placeholder="Write it here." autocomplete="off" aria-label="What's in your head right now?"></textarea>
    </div>
    <button class="act disp" id="send" type="button" disabled>Send<sup>*</sup></button>
  </div>
</div>
<input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">

<div class="foot">
  <p class="note">* Anonymous, stored in the EU, never sold or shared. Sending means you're ok with that.</p>
</div>

<section class="after" id="after" aria-live="polite"><h2 class="disp">Thank you.</h2><p>You were here before the sun went down.</p>
  <svg class="mark" role="img" aria-label="APUS" viewBox="10 28 80 44"><path d="M22 58 A28 28 0 0 1 78 58 Z" fill="#FF5A1F"/><ellipse cx="56" cy="66" rx="34" ry="5" fill="#FFB15C" opacity="0.55"/><rect x="12" y="57.5" width="76" height="1.5" fill="#F1E9DC"/></svg></section>
<div class="grain" aria-hidden="true"></div>

<script>
const PREVIEW = true; // lab: nothing is saved
const CFG = { url: "https://wyqpxtfsgqfpnlufkvcg.supabase.co", key: "sb_publishable_4ZXzZizUU6g-vHd_vrpcwg_VLGoqjss", table: "vibes", col: "feeling" };
const $ = (id) => document.getElementById(id);
const zoom = $('zoom'), win = $('win'), line = $('line'), shown = $('shown'), send = $('send'), sun = $('sun'), rsun = $('rsun'), bigsun = $('bigsun'), bigrefl = $('bigrefl');

/* letters out of the fog, in a slightly random order */
function letters(el, sinkOrder) {
  const t = el.textContent; el.textContent = '';
  t.split(' ').forEach((word, wi, all) => {
    const w = document.createElement('span'); w.style.whiteSpace = 'nowrap'; w.style.display = 'inline-block';
    [...word].forEach((ch) => {
      const s = document.createElement('span'); s.className = 'c'; s.textContent = ch;
      s.style.setProperty('--d', (0.25 + Math.random() * 1.4).toFixed(2) + 's');
      s.style.setProperty('--s', (Math.random() * .5).toFixed(2) + 's');
      w.appendChild(s);
    });
    el.appendChild(w); if (wi < all.length - 1) el.appendChild(document.createTextNode(' '));
  });
}
letters($('q')); letters($('qr'));

/* tap the mirror: a real zoom into its sun. The big sun starts exactly on top of the small one
   and grows with the photograph, same curve, same time, so it never cuts. */
const EASE = 'cubic-bezier(.65,0,.35,1)', DUR = 2000;
const hz = $('bighz');
let writing = false;
function rectOf(el) { const r = el.getBoundingClientRect(); return { l: r.left, t: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, b: r.bottom }; }
function enter(e) {
  if (writing) return; writing = true;
  if (e) e.preventDefault();
  document.querySelectorAll('#q .c, #qr .c').forEach((c) => c.classList.add('sink'));
  const vw = innerWidth;
  const r0 = rectOf(sun), h0 = rectOf(win.querySelector('.hz'));
  bigsun.style.transition = 'none'; hz.style.transition = 'none';
  bigsun.style.transform = 'none'; hz.style.transform = 'none';
  const rF = rectOf(bigsun), hF = rectOf(hz);
  // start the overlay sun and horizon exactly where the photo's are
  bigsun.style.transformOrigin = '50% 100%';
  bigsun.style.transform = `translate(${r0.cx - rF.cx}px, ${r0.b - rF.b}px) scale(${r0.w / rF.w})`;
  hz.style.transform = `translate(${h0.cx - hF.cx}px, ${h0.t - hF.t}px) scaleX(${h0.w / hF.w})`;
  // zoom the photograph around its sun, landing where the big sun sits
  const st = zoom.getBoundingClientRect();
  zoom.style.transformOrigin = `${r0.cx - st.left}px ${r0.b - st.top}px`;
  document.body.classList.add('writing');
  void bigsun.offsetWidth;
  requestAnimationFrame(() => {
    const t = `transform ${DUR}ms ${EASE}`;
    zoom.style.transition = t; bigsun.style.transition = t; hz.style.transition = t;
    zoom.style.transform = `translate(${rF.cx - r0.cx}px, ${rF.b - r0.b}px) scale(${rF.w / r0.w})`;
    bigsun.style.transform = 'none'; hz.style.transform = 'none';
  });
  setTimeout(() => {
    bigsun.style.transition = 'transform 1.2s cubic-bezier(.4,0,.2,1)'; hz.style.transition = '';
    line.focus({ preventScroll: true });
  }, DUR + 50);
}
['click', 'touchend'].forEach((ev) => {
  $('ask').addEventListener(ev, enter);
  document.querySelector('.stage').addEventListener(ev, enter);
});
$('ask').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') enter(e); });

/* writing: plain text, the sun sets as the line grows */
function render() {
  shown.textContent = '';
  line.value.split(/(\s+)/).forEach((w) => {
    if (!w) return;
    if (/^\s+$/.test(w)) { shown.appendChild(document.createTextNode(w)); return; }
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w; shown.appendChild(s);
  });
  const k = line.value.length / 160;
  sun.style.transform = `translateY(${(k * 100).toFixed(1)}%)`;
  rsun.style.transform = `scaleY(${(1 - k).toFixed(3)})`;
  bigsun.style.transform = `translateY(${(k * 100).toFixed(1)}%)`;
  bigrefl.style.transform = `scaleY(${(1 - k).toFixed(3)})`;
  $('dusk').style.opacity = (k * 0.9).toFixed(3);
  $('glow').style.opacity = (1 - k * 0.85).toFixed(3);
  send.disabled = line.value.trim().length < 3;
}
line.addEventListener('input', () => { render(); line.style.height = 'auto'; line.style.height = Math.max(84, line.scrollHeight) + 'px'; });
render();

async function save(text) {
  if (PREVIEW) { await new Promise((r) => setTimeout(r, 400)); return true; }
  const r = await fetch(CFG.url + '/rest/v1/' + CFG.table, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ [CFG.col]: text, consent: true }) });
  return r.ok;
}

/* send: the words fall, the sun comes back up, shrinks into the logo, then thank you */
send.addEventListener('click', async () => {
  const t = line.value.trim().slice(0, 160); if (t.length < 3) return;
  send.disabled = true;
  if (!$('website').value && !(await save(t))) { send.disabled = false; return; }
  line.blur(); document.body.classList.add('sent');
  shown.querySelectorAll('.w').forEach((w, i, all) => { w.style.transitionDelay = ((all.length - i) * 0.035) + 's'; });
  shown.classList.add('fall');
  // the sun rises back to half
  setTimeout(() => {
    bigsun.style.transition = 'transform .9s cubic-bezier(.3,0,.2,1)'; bigsun.style.transform = 'none';
    bigrefl.style.transform = 'scaleY(1)'; $('glow').style.opacity = '0'; $('dusk').style.opacity = '.55';
  }, 350);
  // then it leaves the horizon and shrinks into the logo
  setTimeout(() => {
    const R = rectOf(bigsun), H = rectOf(hz), m = rectOf(document.querySelector('.after .mark'));
    const T = { w: m.w * 56 / 80, cx: m.l + m.w * 50 / 80, b: m.t + m.h * 30 / 44 };
    const L = { w: m.w * 76 / 80, cx: m.l + m.w * 50 / 80, t: m.t + m.h * 29.5 / 44, h: m.h * 1.5 / 44 };
    const fly = document.createElement('div'); fly.className = 'flysun';
    Object.assign(fly.style, { left: R.l + 'px', top: R.t + 'px', width: R.w + 'px', height: R.h + 'px' });
    document.body.appendChild(fly); bigsun.style.visibility = 'hidden';
    hz.style.zIndex = 12; hz.style.position = 'fixed';
    hz.style.transition = 'transform 1.25s ' + EASE;
    $('dusk').style.zIndex = '2'; $('dusk').style.opacity = '1'; document.querySelector('.fx').style.transition = 'opacity .6s'; document.querySelector('.fx').style.opacity = '0';
    requestAnimationFrame(() => {
      fly.style.transform = `translate(${T.cx - R.cx}px, ${T.b - R.b}px) scale(${T.w / R.w})`;
      hz.style.transformOrigin = '50% 50%';
      hz.style.transform = `translate(${L.cx - H.cx}px, ${L.t - H.t}px) scale(${L.w / H.w}, ${Math.max(.4, L.h / H.h)})`;
    });
    setTimeout(() => {
      $('after').classList.add('in');
      setTimeout(() => { fly.style.opacity = '0'; hz.style.transition = 'opacity .35s'; hz.style.opacity = '0'; }, 120);
    }, 1300);
  }, 1300);
});
</script>
</body>
</html>
