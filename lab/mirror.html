<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>APUS</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap">
<link rel="stylesheet" href="base.css">
<style>:root{--ox:50%;--oy:43%}
.sky{inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;opacity:.55;-webkit-mask-image:linear-gradient(#000 0,#000 30%,transparent 48%);mask-image:linear-gradient(#000 0,#000 30%,transparent 48%)}
.bw{filter:grayscale(1) contrast(1.75) brightness(.88)}
.win{position:absolute;left:40.5%;top:25%;width:20%;height:35%;overflow:hidden;clip-path:polygon(0 6%,100% 0,100% 100%,0 100%)}
.win .sun{left:20%;width:60%;height:12.4%;top:42.6%}
.win .hz{position:absolute;left:0;right:0;top:55%;height:2px;background:#F1E9DC;opacity:.85}</style>
</head>
<body>
<!-- Photos: Unsplash License (free to use). Mirror in the water: 8machine. Sculpture: Danil Zakhvatkin. -->
<div class="stage" aria-hidden="true"><div class="zoom" id="zoom"><img class="full bw" src="https://images.unsplash.com/photo-1643686881664-1fea30b34787?w=1400&q=72&fm=jpg&sat=-100&auto=format" alt="">
<img class="sky bw" src="https://images.unsplash.com/photo-1768170631448-a8b28ae4424b?w=1400&q=72&fm=jpg&sat=-100&auto=format" alt="">
<div class="win" id="win"><div class="sun" id="sun"></div><div class="hz"></div></div></div></div>
<div class="vig" aria-hidden="true"></div>
<img class="wm" src="../wordmark.webp" alt="APUS">
<div class="ui">
  <label class="q disp" for="line">What's in your head right now?</label>
  <p class="sub disp">The text you'd send at 2am. Or the one you never send.</p>
  <textarea id="line" maxlength="160" rows="1" placeholder="Write it here." autocomplete="off"></textarea>
  <button class="act disp" id="send" type="button" disabled>Send<sup>*</sup></button>
  <p class="note">* Anonymous, stored in the EU, never sold or shared. Sending means you're ok with that.</p>
</div>
<section class="after" id="after" hidden><h2 class="disp">Thank you.</h2><p>You were here before the sun went down.</p></section>
<div class="grain" aria-hidden="true"></div>
<script type="module">import { run } from './ui.js';
const z = document.getElementById('zoom'), sun = document.getElementById('sun');
run((p, t) => { const s = 1 + Math.min(p, 1) * 0.5 + Math.max(0, p - 1) * 3; z.style.transform = `scale(${s.toFixed(4)})`; sun.style.transform = `translateY(${(Math.min(p,1)*60).toFixed(1)}%)`; });</script>
</body>
</html>
